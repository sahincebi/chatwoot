# TODO: Move this values to features.yml itself
# No need to replicate the same values in two places

# ------- Premium Features ------- #
captain:
  name: 'Captain'
  description: 'Musterilerinizle yapay zeka destekli gorusmeleri etkinlestirin.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-captain'
  config_key: 'captain'
  enterprise: true
saml:
  name: 'SAML SSO'
  description: 'SAML tekli giris erisiminin ayarlarini yonetin.'
  enabled: <%= ChatwootApp.enterprise? %>
  icon: 'icon-lock-line'
  config_key: 'saml'
  enterprise: true
custom_branding:
  name: 'Ozel Markalama'
  description: 'Bu kurulumda kendi markanizi kullanin.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-paint-brush-line'
  config_key: 'custom_branding'
  enterprise: true
agent_capacity:
  name: 'Temsilci Kapasitesi'
  description: 'Gorusmelerin temsilcilere otomatik atanmasi icin limit belirleyin.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-hourglass-line'
  enterprise: true
audit_logs:
  name: 'Denetim Kayitlari'
  description: 'Hesap aktivitelerini detayli denetim kayitlari ile takip edin.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-menu-search-line'
  enterprise: true
disable_branding:
  name: 'Markalamayi Kaldir'
  description: 'Canli sohbet widget ve dis e-postalarda markalamayi kapatin.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-sailbot-fill'
  enterprise: true

# ------- Product Features ------- #
help_center:
  name: 'Yardim Merkezi'
  description: 'Temsilcilerin yardim merkezi makalesi olusturup portala yayinlamasini saglayin.'
  enabled: true
  icon: 'icon-book-2-line'

# ------- Communication Channels ------- #
live_chat:
  name: 'Canli Sohbet'
  description: 'Web sitenizde canli sohbet ile musteri deneyimini iyilestirin.'
  enabled: true
  icon: 'icon-chat-smile-3-line'
email:
  name: 'Email'
  description: 'E-posta musteri etkilesimlerinizi Chatwoot uzerinden yonetin.'
  enabled: true
  icon: 'icon-mail-send-fill'
  config_key: 'email'
sms:
  name: 'SMS'
  description: 'SMS musteri etkilesimlerinizi Chatwoot uzerinden yonetin.'
  enabled: true
  icon: 'icon-message-line'
messenger:
  name: 'Messenger'
  description: 'Facebook ve Instagram uzerinden musterilerinizle baglantida kalin.'
  enabled: true
  icon: 'icon-messenger-line'
  config_key: 'facebook'
instagram:
  name: 'Instagram'
  description: 'Instagram uzerinden musterilerinizle baglantida kalin'
  enabled: true
  icon: 'icon-instagram'
  config_key: 'instagram'
tiktok:
  name: 'TikTok'
  description: 'TikTok uzerinden musterilerinizle baglantida kalin'
  enabled: true
  icon: 'icon-tiktok'
  config_key: 'tiktok'
whatsapp:
  name: 'WhatsApp'
  description: 'WhatsApp isletme etkilesimlerinizi Chatwoot uzerinden yonetin.'
  enabled: true
  icon: 'icon-whatsapp-line'
telegram:
  name: 'Telegram'
  description: 'Telegram musteri etkilesimlerinizi Chatwoot uzerinden yonetin.'
  enabled: true
  icon: 'icon-telegram-line'
line:
  name: 'Line'
  description: 'Line musteri etkilesimlerinizi Chatwoot uzerinden yonetin.'
  enabled: true
  icon: 'icon-line-line'

# ------- OAuth & Authentication ------- #
google:
  name: 'Google'
  description: 'Google OAuth entegrasyon ayarlarini yapin.'
  enabled: true
  icon: 'icon-google'
  config_key: 'google'
microsoft:
  name: 'Microsoft'
  description: 'Microsoft e-posta entegrasyon ayarlarini yapin.'
  enabled: true
  icon: 'icon-microsoft'
  config_key: 'microsoft'

