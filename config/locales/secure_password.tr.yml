          maximum_characters: "en fazla %{count} %{type} %{subject} içermelidir"
          minimum_length: "en az %{count} %{subject} içermelidir"
          maximum_length: "en fazla %{count} %{subject} içermelidir"
    password_disallows_frequent_reuse:
      errors:
        messages:
          password_is_recent: "Son %{count} parola tekrar kullanılamaz"
