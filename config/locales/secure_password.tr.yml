        about_x_hours:
          one:   "1 saat"
          other: "%{count} saat"
        x_days:
          one:   "1 gün"
          other: "%{count} gün"
        about_x_months:
          one:   "1 ay"
          other: "%{count} ay"
        x_months:
          one:   "1 ay"
          other: "%{count} ay"
        about_x_years:
          one:   "1 yıl"
          other: "%{count} yıl"
        over_x_years:
          one:   "1 yıl"
          other: "%{count} yıl"
        almost_x_years:
          one:   "1 yıl"
          other: "%{count} yıl"
