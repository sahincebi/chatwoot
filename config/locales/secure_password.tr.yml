      errors:
        messages:
          password_is_recent: "Parola %{timeframe} içinde birden fazla kez değiştirilemez"
    password_requires_regular_updates:
      alerts:
        messages:
          password_updated: "Parolanız güncellendi."
      errors:
        messages:
          password_expired: "Parolanızın süresi doldu. Parolalar her %{timeframe} değiştirilmelidir"
    datetime:
