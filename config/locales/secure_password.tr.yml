      one: "karakteri"
      other: "karakter"

    types:
      uppercase: "büyük harf"
      downcase: "küçük harf"
      lowercase: "küçük harf"
      number: "rakam"
      special: "özel"

    password_has_required_content:
      errors:
        messages:
          unknown_characters: "%{count} geçersiz %{subject} içeriyor"
